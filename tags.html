"TossAPI":[{"title":"Toss Payments 연동하면서 만난 이슈들","url":"/study/2025/03/01/toss_payments_api.html","date":"2025.03.01"}],"알쓸개잡-알아두면 쓸모있는 개발 잡지식":[{"title":"yaml파일과 yml파일의 차이점","url":"/study/2025/02/20/yaml.html","date":"2025.02.20"}],"dnd-kit":[{"title":"Direction을 통한 dnd관리","url":"/dnd-kit/typescript/2025/02/16/dnd_direction.html","date":"2025.02.16"}],"Infra":[{"title":"넷플릭스의 영상은 어디에 저장돼있을까? (CDN)","url":"/dev/infra/2024/03/06/cdn.html","date":"2024.03.06"}],"CDN":[{"title":"넷플릭스의 영상은 어디에 저장돼있을까? (CDN)","url":"/dev/infra/2024/03/06/cdn.html","date":"2024.03.06"}],"Event":[{"title":"React - 이벤트 전달을 막아주는 e.preventDefault()와 e.stopPropagation()","url":"/dev/react/2024/03/04/e.preventDefault_and_e.stopPropagation.html","date":"2024.03.04"}],"개발일기":[{"title":"[ 스타트업 | 신입 개발 일기 ] - 01. 첫번째 업무, 소스 코드 분석하기","url":"/journal/development diary/2024/02/26/source_code.html","date":"2024.02.26"}],"신입개발자":[{"title":"[ 스타트업 | 신입 개발 일기 ] - 01. 첫번째 업무, 소스 코드 분석하기","url":"/journal/development diary/2024/02/26/source_code.html","date":"2024.02.26"}],"스타트업":[{"title":"[ 스타트업 | 신입 개발 일기 ] - 01. 첫번째 업무, 소스 코드 분석하기","url":"/journal/development diary/2024/02/26/source_code.html","date":"2024.02.26"}],"gitmoji":[{"title":"깃모지 사용 할까?","url":"/dev/git/2024/02/25/gitmoji.html","date":"2024.02.25"}]}</script> <script>
    // 겹침 해소 — 씨앗 좌표에서 시작해 서로 밀어내고 컨테이너 안으로 가둔다
    (() => {
      const box = document.getElementById('tag-scatter');
      const dots = Array.prototype.slice.call(box.querySelectorAll('.tag-dot'));
      if (!dots.length) return;

      function layout() {
        const W = box.clientWidth;
        const H = box.clientHeight;
        const PAD = 4; // 태그 사이 최소 여백(px) — 작을수록 빽빽하게

        const items = dots.map((el) => {
          const w = el.offsetWidth;
          const h = el.offsetHeight;
          return {
            el: el,
            w: w,
            h: h,
            // 씨앗 좌표(%)를 픽셀 중심으로 변환
            x: (parseFloat(el.dataset.seedLeft) / 100) * W,
            y: (parseFloat(el.dataset.seedTop) / 100) * H,
          };
        });

        function clamp(it) {
          it.x = Math.min(Math.max(it.x, it.w / 2 + 2), W - it.w / 2 - 2);
          it.y = Math.min(Math.max(it.y, it.h / 2 + 2), H - it.h / 2 - 2);
        }
        items.forEach(clamp);

        for (let pass = 0; pass < 80; pass++) {
          let moved = false;
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const a = items[i];
              const b = items[j];
              let dx = b.x - a.x;
              let dy = b.y - a.y;
              const minX = (a.w + b.w) / 2 + PAD;
              const minY = (a.h + b.h) / 2 + PAD;
              const ox = minX - Math.abs(dx);
              const oy = minY - Math.abs(dy);
              if (ox <= 0 || oy <= 0) continue; // 안 겹침

              moved = true;
              // 덜 밀어내도 되는 축으로만 분리 — 배치가 덜 흐트러진다
              if (ox < oy) {
                const sx = (dx || 1) > 0 ? 1 : -1;
                a.x -= (sx * ox) / 2;
                b.x += (sx * ox) / 2;
              } else {
                const sy = (dy || 1) > 0 ? 1 : -1;
                a.y -= (sy * oy) / 2;
                b.y += (sy * oy) / 2;
              }
              clamp(a);
              clamp(b);
            }
          }
          if (!moved) break;
        }

        items.forEach((it, i) => {
          it.el.style.left = it.x + 'px';
          it.el.style.top = it.y + 'px';
          // 중심에서 바깥으로 퍼지듯 등장
          if (!box.classList.contains('ready')) {
            it.el.style.setProperty('--enter-delay', (i * 12) + 'ms');
          }
        });
        box.classList.add('ready');
        bindRepel(items);
      }

      // 커서 주변의 태그들이 물결처럼 밀려난다 (커서가 올라간 태그 자신은 제자리에서 커진다)
      let boundItems = null;
      function bindRepel(items) {
        // layout()은 리사이즈마다 다시 도니, 리스너는 한 번만 건다
        boundItems = items;
        if (bindRepel.done) return;
        bindRepel.done = true;

        const REACH = 210; // 커서 영향 반경(px) — 태그가 크게 확대되므로 넉넉히
        const STRENGTH = 52; // 최대 밀림(px)
        let pending = false;
        let cursor = null;

        function apply() {
          pending = false;
          if (!cursor) return;
          const hovered = box.querySelector('.tag-dot:hover');
          boundItems.forEach((it) => {
            // 커서가 올라간 태그는 확대 효과가 있으니 밀지 않는다
            if (it.el === hovered) {
              it.el.style.setProperty('--px', '0px');
              it.el.style.setProperty('--py', '0px');
              return;
            }
            const dx = it.x - cursor.x;
            const dy = it.y - cursor.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist > REACH) {
              it.el.style.setProperty('--px', '0px');
              it.el.style.setProperty('--py', '0px');
              return;
            }
            // 가까울수록 강하게, 멀수록 부드럽게 사그라든다
            const push = STRENGTH * Math.pow(1 - dist / REACH, 1.3);
            it.el.style.setProperty('--px', ((dx / dist) * push).toFixed(1) + 'px');
            it.el.style.setProperty('--py', ((dy / dist) * push).toFixed(1) + 'px');
          });
        }

        function release() {
          cursor = null;
          boundItems.forEach((it) => {
            it.el.style.setProperty('--px', '0px');
            it.el.style.setProperty('--py', '0px');
          });
        }

        box.addEventListener('mousemove', (e) => {
          const r = box.getBoundingClientRect();
          cursor = { x: e.clientX - r.left, y: e.clientY - r.top };
          if (!pending) {
            pending = true;
            requestAnimationFrame(apply);
          }
        });
        box.addEventListener('mouseleave', release);

        // 키보드 이동 시에도 주변이 반응하도록
        dots.forEach((el) => {
          el.addEventListener('focus', () => {
            for (let i = 0; i < boundItems.length; i++) {
              if (boundItems[i].el === el) {
                cursor = { x: boundItems[i].x, y: boundItems[i].y };
                apply();
                break;
              }
            }
          });
        });
        box.addEventListener('focusout', release);
      }

      // 조회수가 도착하면 크기를 다시 매긴다 —
      // 빌드 시점 크기는 글 수 기준이고, 여기서 "글 수 + 조회수"로 갱신한다.
      function resizeByViews(map) {
        if (!map) return;
        let data = JSON.parse(document.getElementById('tag-data').textContent);
        const scores = [];
        dots.forEach((el) => {
          let posts = data[el.dataset.tag] || [];
          const views = posts.reduce((sum, p) => { return sum + (map[p.url] || 0); }, 0);
          // 글 수와 조회수를 반반 — 조회수가 0인 초기에도 배치가 무너지지 않는다
          scores.push({ el: el, count: posts.length, views: views });
        });

        const maxCount = Math.max.apply(null, scores.map((s) => { return s.count; }));
        const minCount = Math.min.apply(null, scores.map((s) => { return s.count; }));
        const maxViews = Math.max.apply(null, scores.map((s) => { return s.views; }));

        scores.forEach((s) => {
          const byCount = maxCount === minCount ? 1 : (s.count - minCount) / (maxCount - minCount);
          const byViews = maxViews > 0 ? s.views / maxViews : 0;
          let t = maxViews > 0 ? byCount * 0.5 + byViews * 0.5 : byCount;
          s.el.style.fontSize = (0.8 + t * 1.1).toFixed(3) + 'rem';
          s.el.style.fontWeight = t > 0.55 ? 700 : t > 0.25 ? 600 : 500;
          s.el.style.setProperty('--tone', t.toFixed(3));
          if (s.views > 0) {
            s.el.title = s.el.dataset.tag + ' — 글 ' + s.count + '개 · 조회 ' + s.views;
          }
        });
        layout(); // 크기가 바뀌었으니 겹침을 다시 푼다
      }

      // 폰트 로드 후 측정해야 폭이 정확하다
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          layout();
          if (window.__viewsReady) window.__viewsReady.then(resizeByViews);
        });
      } else {
        window.addEventListener('load', () => {
          layout();
          if (window.__viewsReady) window.__viewsReady.then(resizeByViews);
        });
      }
      let t;
      window.addEventListener('resize', () => {
        clearTimeout(t);
        t = setTimeout(layout, 150);
      });
    })();

    (() => {
      const data = JSON.parse(document.getElementById('tag-data').textContent);
      const section = document.getElementById('tag-posts');
      const titleEl = document.getElementById('tag-posts-title');
      const listEl = document.getElementById('tag-posts-list');
      const buttons = document.querySelectorAll('.tag-dot');

      function select(tag, scroll) {
        const posts = data[tag];
        if (!posts) return;
        buttons.forEach((b) => {
          b.classList.toggle('selected', b.dataset.tag === tag);
        });
        titleEl.innerHTML =
          '<span class="tag-posts-chip">#' + tag.replace(/</g, '&lt;') + '</span>' +
          '<span class="tag-posts-count">글 ' + posts.length + '개</span>';
        listEl.innerHTML = posts
          .map((p) => {
            return (
              '<li><time>' + p.date + '</time><a href="' + p.url + '">' +
              p.title.replace(/</g, '&lt;') + '</a>' +
              '<span class="views" data-views-path="' + p.url + '" hidden></span></li>'
            );
          })
          .join('');
        section.hidden = false;
        if (window.fillViews) window.fillViews(listEl);
        if (scroll) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + tag);
      }

      buttons.forEach((b) => {
        b.addEventListener('click', () => { select(b.dataset.tag, true); });
      });

      document.getElementById('tag-posts-close').addEventListener('click', () => {
        section.hidden = true;
        buttons.forEach((b) => { b.classList.remove('selected'); });
        history.replaceState(null, '', location.pathname);
      });

      // 기존 /tags.html#태그명 링크 호환 — 해시가 있으면 그 태그를 바로 연다
      const hash = decodeURIComponent(location.hash.slice(1));
      if (hash && data[hash]) select(hash, true);
    })();

      // 조회수·댓글수·추천수 채우기 — 정적 사이트라 숫자는 클라이언트에서 받아 자리에 넣는다.
      // 0도 그대로 보여준다(자리를 비우면 "기능이 사라진 것"처럼 보인다).
      // 워커 응답 자체가 실패했을 때만 자리를 비워둔다.
      const METRIC_ICON = {
        views:
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
        comments:
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>',
        likes:
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>',
      };

      function fillViews(root) {
        const put = (attr, map, icon, label) => {
          if (!map) return;
          root.querySelectorAll('[' + attr + ']').forEach((el) => {
            const n = map[el.getAttribute(attr)] ?? 0;
            el.innerHTML = icon + '<span>' + n.toLocaleString() + '</span>';
            el.setAttribute('aria-label', label + ' ' + n);
            el.hidden = false;
          });
        };
        put('data-views-path', window.__views, METRIC_ICON.views, '조회수');
        put('data-comments-path', window.__comments, METRIC_ICON.comments, '댓글 수');
        put('data-likes-path', window.__likes, METRIC_ICON.likes, '추천 수');
      }
      window.fillViews = fillViews;

      {
        const api = 'https://kimmand0o0-blog-chat.kimmand0o0.workers.dev';
        const get = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
        window.__viewsReady = Promise.all([
          get(api + '/api/views/top?limit=1000'),
          get(api + '/api/comments/counts'),
          get(api + '/api/likes/top?limit=1000'),
        ]).then(([views, comments, likes]) => {
          // 셋 다 실패했다면 지표 자체를 못 받은 것 — 0 을 지어내지 않고 자리를 비워둔다
          if (!views && !comments && !likes) return {};
          window.__views = Object.fromEntries((views?.items ?? []).map((i) => [i.path, i.views]));
          window.__comments = Object.fromEntries(
            (comments?.items ?? []).map((i) => [i.path, i.count])
          );
          window.__likes = Object.fromEntries((likes?.items ?? []).map((i) => [i.path, i.likes]));
          fillViews(document);
          return window.__views;
        });
      }

      // 스크롤 시작 여부만 표시 — sticky 헤더 경계선 노출용
      (() => {
        const root = document.documentElement;
        function sync() {
          root.setAttribute('data-scrolled', window.scrollY > 8 ? 'true' : 'false');
        }
        sync();
        window.addEventListener('scroll', sync, { passive: true });
      })();

      // 목차 — 현재 읽고 있는 섹션 표시
      (() => {
        const links = document.querySelectorAll('.toc a');
        if (!links.length) return;
        const map = {};
        const targets = [];
        links.forEach((a) => {
          const id = decodeURIComponent(a.getAttribute('href').slice(1));
          const el = document.getElementById(id);
          if (el) {
            map[id] = a;
            targets.push(el);
          }
        });
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              links.forEach((a) => { a.classList.remove('active'); });
              const a = map[e.target.id];
              if (a) a.classList.add('active');
            });
          },
          // 헤더 아래 상단 밴드에 들어온 헤딩을 현재 섹션으로 본다
          { rootMargin: '-72px 0px -75% 0px' }
        );
        targets.forEach((el) => { io.observe(el); });
      })();

      // 글 제목이 헤더 위로 지나가면, 소개 문구 자리를 제목으로 바꿔치기
      {
        const postTitle = document.querySelector('article.post h1.post-title');
        const slot = document.querySelector('.header-post-title');
        const tagline = document.querySelector('.tagline');
        if (postTitle && slot && tagline) {
          // 제목은 span 으로 감싼다 — 넘칠 때 이 span 만 흐르게 하려고
          const inner = document.createElement('span');
          inner.textContent = postTitle.textContent.trim();
          slot.appendChild(inner);
          // 슬롯 폭보다 길면 잘라내는 대신 흐르게 한다
          requestAnimationFrame(() => {
            if (inner.scrollWidth > slot.clientWidth + 2) slot.classList.add('is-long');
          });
          const io = new IntersectionObserver(
            ([entry]) => {
              const hidden = !entry.isIntersecting && entry.boundingClientRect.top < 0;
              slot.hidden = !hidden;
              tagline.hidden = hidden;
            },
            { rootMargin: '-4px 0px 0px 0px', threshold: 0 }
          );
          io.observe(postTitle);
        }
      }

      // 정렬 필터 접기/펼치기 — 선택된 항목만 보이고, 누르면 스르륵 펼쳐진다
      {
        const bar = document.querySelector('.sort-bar');
        if (bar) {
          const toggle = bar.querySelector('.sort-toggle');
          const current = bar.querySelector('.sort-current');
          const setOpen = (open) => {
            bar.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', String(open));
          };
          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setOpen(!bar.classList.contains('open'));
          });
          // 항목을 고르면 라벨을 바꾸고 접는다 (정렬 자체는 각 페이지 스크립트가 처리)
          bar.querySelectorAll('.sort-btn').forEach((b) => {
            b.addEventListener('click', () => {
              current.textContent = b.textContent.trim();
              setOpen(false);
            });
          });
          document.addEventListener('click', (e) => {
            if (bar.classList.contains('open') && !bar.contains(e.target)) setOpen(false);
          });
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setOpen(false);
          });
        }
      }

      // 모바일 햄버거 메뉴
      {
        const toggle = document.getElementById('nav-toggle');
        const nav = document.getElementById('site-nav');
        const setOpen = (open) => {
          nav.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', String(open));
          toggle.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
          toggle.classList.toggle('is-open', open);
        };
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          setOpen(!nav.classList.contains('open'));
        });
        // 메뉴 밖을 누르거나 ESC 를 누르면 닫는다
        document.addEventListener('click', (e) => {
          if (nav.classList.contains('open') && !nav.contains(e.target)) setOpen(false);
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') setOpen(false);
        });
      }

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next =
          document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    </script> <script type="module">
      // mermaid 클라이언트 렌더 (기존 Jekyll 셋업과 동일하게 mermaid@10 사용)
      if (document.querySelector('pre.mermaid')) {
        const { default: mermaid } = await import(
          'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs'
        );
        mermaid.initialize({
          startOnLoad: false,
          theme:
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default',
        });
        mermaid.run({ querySelector: 'pre.mermaid' });
      }
    </script> </body> </html>
