<!DOCTYPE html><html lang="ko"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search | Haeran&#39;s blog</title><meta name="description" content="문제의 본질을 파악하고 해결하는 과정을 기록합니다."><link rel="icon" href="/assets/images/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png"><link rel="alternate" type="application/rss+xml" title="Haeran's blog" href="/feed.xml"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><script>
      // FOUC 방지: 렌더 전에 저장된 테마 적용

        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

      gtag('config', 'G-ZNXE6HSKMS');

<style>.search-empty{margin:2rem 0 0;font-size:.98rem;color:var(--muted)}
</style></head> <body> <!-- 헤더는 뷰포트 전체 폭 — 안쪽 컨텐츠만 본문과 같은 폭으로 정렬한다 --> <header class="site-header"> <div class="header-inner"> <a class="brand" href="/">haeran<span style="color: var(--accent);">'s</span> blog</a> <nav> <a href="/archives.html"> Archives </a><a href="/tags.html"> Tags </a><a href="/about.html"> About </a><a href="/search.html" class="active" aria-current="page"> Search </a> <button id="theme-toggle" aria-label="테마 전환">◐</button> </nav> </div> </header> <div class="wrap"> <main> <h1 class="page-title">Search</h1> <input id="search-input" type="search" placeholder="제목·태그·본문으로 검색…" autofocus>  <section id="default-section"> <h2 class="group-title" id="default-title">최근 글</h2> <ul class="archive-list" id="default-list"></ul> </section>  <section id="result-section" hidden> <h2 class="group-title" id="result-title"></h2> <ul class="archive-list" id="result-list"></ul> </section>  <section id="empty-section" hidden> <p class="search-empty" id="empty-message"></p> <h2 class="group-title">이런 글은 어때요</h2> <ul class="archive-list" id="empty-list"></ul> </section> <script>(function(){const chatOrigin = "https://kimmand0o0-blog-chat.kimmand0o0.workers.dev";

    (function () {
      var input = document.getElementById('search-input');
      var defaultSection = document.getElementById('default-section');
      var defaultTitle = document.getElementById('default-title');
      var defaultList = document.getElementById('default-list');
      var resultSection = document.getElementById('result-section');
      var resultTitle = document.getElementById('result-title');
      var resultList = document.getElementById('result-list');
      var emptySection = document.getElementById('empty-section');
      var emptyMessage = document.getElementById('empty-message');
      var emptyList = document.getElementById('empty-list');
      var posts = [];

      function row(p) {
        return (
          '<li><time>' + p.date + '</time><a href="' + p.url + '">' +
          p.title.replace(/</g, '&lt;') + '</a></li>'
        );
      }

      function render(el, list) {
        el.innerHTML = list.map(row).join('');
      }

      function search(q) {
        var needle = q.toLowerCase();
        return posts.filter(function (p) {
          return (
            p.title.toLowerCase().includes(needle) ||
            (p.tags || []).some(function (t) { return t.toLowerCase().includes(needle); }) ||
            (p.categories || []).some(function (c) { return c.toLowerCase().includes(needle); }) ||
            (p.excerpt || '').toLowerCase().includes(needle)
          );
        });
      }

      function onInput() {
        var q = input.value.trim();
        if (!q) {
          defaultSection.hidden = false;
          resultSection.hidden = true;
          emptySection.hidden = true;
          return;
        }
        defaultSection.hidden = true;
        var hits = search(q);
        if (hits.length) {
          resultSection.hidden = false;
          emptySection.hidden = true;
          resultTitle.textContent = '검색 결과 (' + hits.length + ')';
          render(resultList, hits.slice(0, 50));
        } else {
          resultSection.hidden = true;
          emptySection.hidden = false;
          emptyMessage.textContent = '“' + q + '”에 해당하는 글이 없어요.';
          // 추천 5개는 기본 목록(많이 본 글 또는 최근 글)에서 가져온다
          render(emptyList, (window.__defaultPosts || posts).slice(0, 5));
        }
      }

      fetch('/search.json')
        .then(function (r) { return r.json(); })
        .then(function (json) {
          posts = json;
          // 기본값은 최근 글 — 조회수 데이터가 도착하면 그때 교체한다
          window.__defaultPosts = posts.slice(0, 10);
          render(defaultList, window.__defaultPosts);
          input.addEventListener('input', onInput);

          // 조회수 상위 — 워커가 아직 배포 전이거나 데이터가 비면 조용히 최근 글 유지
          return fetch(chatOrigin + '/api/views/top?limit=10')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (top) {
              if (!top || !top.items || !top.items.length) return;
              var byUrl = {};
              posts.forEach(function (p) { byUrl[p.url] = p; });
              var ranked = top.items
                .map(function (i) { return byUrl[i.path]; })
                .filter(Boolean);
              if (!ranked.length) return;
              window.__defaultPosts = ranked;
              defaultTitle.textContent = '많이 본 글';
              if (!input.value.trim()) render(defaultList, ranked);
            })
            .catch(function () { /* 조회수는 부가 정보 — 실패해도 검색은 그대로 */ });
        });
    })();
  })();</script> </main> </div> <footer class="site-footer"> <div class="footer-inner"> <span>© 2026 Haeran</span> <span class="links"> <a href="https://github.com/kimmand0o0">GitHub</a> <a href="/feed.xml">RSS</a> </span> </div> </footer> <script>
      // 스크롤 시작 여부만 표시 — sticky 헤더 경계선 노출용
      (function () {
        var root = document.documentElement;
        function sync() {
          root.setAttribute('data-scrolled', window.scrollY > 8 ? 'true' : 'false');
        }
        sync();
        window.addEventListener('scroll', sync, { passive: true });
      })();

      // 목차 — 현재 읽고 있는 섹션 표시
      (function () {
        var links = document.querySelectorAll('.toc a');
        if (!links.length) return;
        var map = {};
        var targets = [];
        links.forEach(function (a) {
          var id = decodeURIComponent(a.getAttribute('href').slice(1));
          var el = document.getElementById(id);
          if (el) {
            map[id] = a;
            targets.push(el);
          }
        });
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              links.forEach(function (a) { a.classList.remove('active'); });
              var a = map[e.target.id];
              if (a) a.classList.add('active');
            });
          },
          // 헤더 아래 상단 밴드에 들어온 헤딩을 현재 섹션으로 본다
          { rootMargin: '-72px 0px -75% 0px' }
        );
        targets.forEach(function (el) { io.observe(el); });
      })();

      document.getElementById('theme-toggle').addEventListener('click', function () {
        var next =
          document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    </script> <script type="module">
      // mermaid 클라이언트 렌더 (기존 Jekyll 셋업과 동일하게 mermaid@10 사용)
      if (document.querySelector('pre.mermaid')) {
        const { default: mermaid } = await import(
          'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs'
        );
        mermaid.initialize({
          startOnLoad: false,
          theme:
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default',
        });
        mermaid.run({ querySelector: 'pre.mermaid' });
      }
    </script> </body> </html>
